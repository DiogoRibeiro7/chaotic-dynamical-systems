url: https://diogoribeiro7.github.io/chaotic-dynamical-systems/
template:
  bootstrap: 5

home:
  title: "Chaotic Dynamical Systems"
  description: >
    R package for extreme value analysis of chaotic dynamical systems.
    Provides tools for simulation, extreme value modeling, and statistical analysis.

reference:
- title: "Simulation Functions"
  desc: "Functions for generating chaotic time series"
  contents:
  - simulate_logistic_map
  - simulate_henon_map
  - simulate_tent_map
  - simulate_lozi_map
  - simulate_cat_map
  - simulate_standard_map
  - simulate_ikeda_map
  - simulate_lorenz
  - simulate_rossler
  - simulate_duffing
  - simulate_mackey_glass
  - logistic_bifurcation
  - ensemble_simulate

- title: "Extreme Value Analysis"
  desc: "Core extreme value theory functions"
  contents:
  - block_maxima
  - block_r_largest
  - exceedances
  - fit_gev
  - fit_gev_rlargest
  - fit_gpd
  - fit_ppp

- title: "Threshold Diagnostics"
  desc: "Tools for threshold selection and validation"
  contents:
  - mean_residual_life
  - mrl_plot
  - hill_estimates
  - hill_plot
  - threshold_diagnostics

- title: "Extremal Index Estimation"
  desc: "Functions for estimating the extremal index"
  contents:
  - extremal_index_runs
  - extremal_index_intervals
  - threshold_exceedances
  - cluster_exceedances
  - hitting_times
  - plot_hts

- title: "Cluster Analysis"
  desc: "Tools for analyzing extreme event clustering"
  contents:
  - cluster_sizes
  - cluster_summary
  - cluster_histogram
  - decluster

- title: "Statistical Diagnostics"
  desc: "Functions for assessing mixing and dependence"
  contents:
  - acf_decay
  - mixing_coefficients
  - d_check
  - estimate_lyapunov_exponent
  - estimate_correlation_dimension

- title: "Bootstrap Methods"
  desc: "Uncertainty quantification for extremal index"
  contents:
  - bootstrap_extremal_index
  - block_bootstrap

- title: "Profile-Likelihood Inference"
  desc: "Likelihood-ratio confidence intervals for GEV and GPD parameters"
  contents:
  - profile_likelihood
  - profile_ci
  - profile_return_level

- title: "broom Tidiers"
  desc: "tidy() / glance() / augment() methods for chaotic_model fits"
  contents:
  - tidy.chaotic_model
  - glance.chaotic_model
  - augment.chaotic_model

- title: "Advanced Analysis"
  desc: "Higher-level modelling utilities"
  contents:
  - extremal_index_multivariate
  - adaptive_threshold_selection
  - fit_nonstationary_gev
  - tail_dependence_coefficient
  - tail_dependence_asymmetric
  - upper_tail_dependence
  - lower_tail_dependence
  - plot_exceedance_clusters
  - tail_dependence_heatmap
  - spectral_analysis_extremes
  - calculate_return_levels
  - validate_extreme_model
  - goodness_of_fit_test

- title: "Utility Functions"
  desc: "General helpers for scripts and examples"
  contents:
  - clean_extreme_data
  - empirical_quantile
  - compute_autocorrelation
  - with_logging

- title: "Comprehensive Analysis"
  desc: "High-level analysis functions"
  contents:
  - run_demo

- title: "Example Datasets"
  desc: "Built-in datasets for demonstrations"
  contents:
  - logistic_ts
  - henon_ts
  - ar1_ts

