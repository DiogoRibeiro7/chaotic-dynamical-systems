site_name: chaoticds
site_description: Extreme value analysis for chaotic dynamical systems in R
site_url: https://diogoribeiro7.github.io/chaotic-dynamical-systems/
repo_url: https://github.com/DiogoRibeiro7/chaotic-dynamical-systems
repo_name: DiogoRibeiro7/chaotic-dynamical-systems
edit_uri: edit/main/docs/
site_dir: site

exclude_docs: |
  dev/**

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

nav:
  - Home: index.md
  - Learn:
      - Getting started: getting-started.md
      - Why extremes in chaotic systems?: concepts/why-chaos-extremes.md
      - Dynamical systems catalogue: models/dynamical-systems.md
  - Methods:
      - Block maxima and POT: methods/block-maxima-pot.md
      - Extremal index and clustering: methods/extremal-index.md
      - Profile likelihood and return levels: methods/profile-likelihood.md
      - Diagnostics: methods/diagnostics.md
      - Multivariate extremes: methods/multivariate.md
  - Tutorials:
      - Logistic map end-to-end: tutorials/logistic-workflow.md
      - Hénon map — BM vs POT: tutorials/henon-evt.md
  - Engineering:
      - Architecture: engineering/architecture.md
      - Performance and C++: engineering/performance.md
  - API:
      - Function reference: reference.md
  - Project:
      - Roadmap: project-roadmap.md
      - Scope and limitations: scope.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

copyright: Copyright &copy; Diogo Ribeiro
