site_name: chaoticds
site_description: Extreme value analysis for chaotic dynamical systems in R
site_url: https://diogoribeiro7.github.io/chaotic-dynamical-systems/
repo_url: https://github.com/DiogoRibeiro7/chaotic-dynamical-systems
repo_name: DiogoRibeiro7/chaotic-dynamical-systems
edit_uri: edit/main/docs/
site_dir: site

exclude_docs: |
  dev/**

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Methods:
      - Dynamical systems: dynamical-systems.md
      - Extreme value analysis: extreme-value-analysis.md
      - Extremal index: extremal-index.md
      - Diagnostics: diagnostics.md
  - Engineering:
      - Performance: performance.md
      - Function reference: reference.md
  - Project:
      - Roadmap: project-roadmap.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

copyright: Copyright &copy; Diogo Ribeiro
