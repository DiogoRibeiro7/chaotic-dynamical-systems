name: Release and GitHub Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/chaoticds

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read DESCRIPTION version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F': ' '$1 == "Version" {print $2}' DESCRIPTION)"
          if [[ -z "$version" ]]; then
            echo "Could not read Version from DESCRIPTION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected="v${version}"
            if [[ "${GITHUB_REF_NAME}" != "$expected" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match DESCRIPTION version $version" >&2
              echo "Expected tag: $expected" >&2
              exit 1
            fi
          fi

  r-source-package:
    name: Build R source package
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Build source package
        shell: bash
        run: |
          set -euo pipefail
          R CMD build .
          package="chaoticds_${{ needs.validate-version.outputs.version }}.tar.gz"
          test -f "$package"
          echo "PACKAGE_FILE=$package" >> "$GITHUB_ENV"

      - name: Upload source package artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaoticds-${{ needs.validate-version.outputs.version }}-source
          path: ${{ env.PACKAGE_FILE }}
          if-no-files-found: error

      - name: Attach source package to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --title "chaoticds ${{ needs.validate-version.outputs.version }}" \
                 --generate-notes
          gh release upload "${GITHUB_REF_NAME}" "$PACKAGE_FILE" --clobber

  github-package:
    name: Publish container package
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.validate-version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.validate-version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.validate-version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=chaoticds
            org.opencontainers.image.description=Extreme value analysis for chaotic dynamical systems in R
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate-version.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish to GitHub Packages
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
