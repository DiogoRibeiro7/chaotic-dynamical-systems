name: Release and GitHub Packages

on:
  pull_request:
    branches: [main]
    paths:
      - "DESCRIPTION"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/release.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/chaoticds

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read DESCRIPTION version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F': ' '$1 == "Version" {print $2}' DESCRIPTION)"
          if [[ -z "$version" ]]; then
            echo "Could not read Version from DESCRIPTION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected="v${version}"
            if [[ "${GITHUB_REF_NAME}" != "$expected" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match DESCRIPTION version $version" >&2
              echo "Expected tag: $expected" >&2
              exit 1
            fi
          fi

  r-source-package:
    name: Build R source package
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        if: github.ref_type != 'tag'
        uses: DiogoRibeiro7/git-actions-collection/.github/actions/setup-r@v1
        with:
          use-public-rspm: "true"

      - name: Install package build dependencies
        if: github.ref_type != 'tag'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
          dependencies: '"hard"'

      - name: Build source package
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          set -euo pipefail
          R CMD build .
          package="chaoticds_${{ needs.validate-version.outputs.version }}.tar.gz"
          test -f "$package"
          echo "PACKAGE_FILE=$package" >> "$GITHUB_ENV"

      - name: Retrieve and verify CRAN-certified candidate
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          set -euo pipefail

          # A tagged release must use the successful candidate gate for this
          # exact commit on main, never an independently rebuilt archive.
          run_id="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/cran-candidate.yml/runs" \
            -f head_sha="${GITHUB_SHA}" \
            -f event=push \
            -f status=success \
            -f per_page=100 \
            --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .head_branch == "main" and .event == "push" and .conclusion == "success") | .id] | first // empty')"
          if [[ -z "$run_id" ]]; then
            echo "No successful CRAN candidate gate for commit ${GITHUB_SHA} on main." >&2
            echo "Wait for certification, then rerun the release workflow on the tag." >&2
            exit 1
          fi

          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name cran-candidate-source \
            --dir candidate

          package="chaoticds_${VERSION}.tar.gz"
          test -f "candidate/$package"
          test -f candidate/SHA256SUMS
          test -f candidate/candidate-metadata.txt

          # Reject any archive not certified from the exact release commit.
          grep -Fxq "commit=${GITHUB_SHA}" candidate/candidate-metadata.txt
          grep -Fxq "version=${VERSION}" candidate/candidate-metadata.txt
          grep -Fxq "file=$package" candidate/candidate-metadata.txt
          (cd candidate && sha256sum --check SHA256SUMS)

          expected_sha="$(sed -n 's/^sha256=//p' candidate/candidate-metadata.txt)"
          actual_sha="$(sha256sum "candidate/$package" | awk '{print $1}')"
          [[ -n "$expected_sha" && "$expected_sha" == "$actual_sha" ]]

          expected_size="$(sed -n 's/^size_bytes=//p' candidate/candidate-metadata.txt)"
          actual_size="$(wc -c < "candidate/$package" | tr -d ' ')"
          [[ -n "$expected_size" && "$expected_size" == "$actual_size" ]]

          echo "Reusing certified $package (SHA-256: $actual_sha; bytes: $actual_size)"
          echo "PACKAGE_FILE=candidate/$package" >> "$GITHUB_ENV"

      - name: Upload source package artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaoticds-${{ needs.validate-version.outputs.version }}-source
          path: ${{ env.PACKAGE_FILE }}
          if-no-files-found: error

      - name: Attach source package to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --title "chaoticds ${{ needs.validate-version.outputs.version }}" \
                 --generate-notes
          gh release upload "${GITHUB_REF_NAME}" "$PACKAGE_FILE" --clobber

  github-package:
    name: Build container package
    needs: [validate-version, r-source-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.validate-version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.validate-version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.validate-version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
          labels: |
            org.opencontainers.image.title=chaoticds
            org.opencontainers.image.description=Extreme value analysis for chaotic dynamical systems in R
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate-version.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
