name: Performance Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    name: Performance benchmarks
    
    steps:
      - uses: actions/checkout@v7
      
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::microbenchmark, any::bench
          needs: check
          
      - name: Install package
        run: R CMD INSTALL .
        
      - name: Run simulation benchmarks
        run: |
          source("benchmarks/run_ci_benchmarks.R")
        shell: Rscript {0}
        
      - name: Run memory benchmarks
        run: |
          library(chaoticds)
          
          cat("=== Memory Usage Tests ===\n")
          
          # Test memory usage with different data sizes
          sizes <- c(1000, 5000, 10000, 50000)
          memory_results <- data.frame(
            size = sizes,
            memory_mb = numeric(length(sizes))
          )
          
          for (i in seq_along(sizes)) {
            n <- sizes[i]
            gc()  # Clean up memory
            
            # Measure memory usage
            mem_before <- as.numeric(object.size(ls(envir = .GlobalEnv)))
            sim_data <- simulate_logistic_map(n, r = 3.8, x0 = 0.2)
            mem_after <- as.numeric(object.size(sim_data))
            
            memory_results$memory_mb[i] <- mem_after / 1024^2
            cat("Size:", n, "Memory:", round(memory_results$memory_mb[i], 2), "MB\n")
            
            rm(sim_data)
            gc()
          }
          
          write.csv(memory_results, "benchmark-results/memory_results.csv", row.names = FALSE)
          cat("Memory results saved to benchmark-results/memory_results.csv\n")
        shell: Rscript {0}
        
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results/
          
      - name: Performance regression check
        run: |
          cat("=== Performance Regression Check ===\n")

          baseline_path <- "benchmarks/baseline/perf_baseline.csv"
          current_path <- "benchmark-results/timing_results.csv"
          if (!file.exists(baseline_path)) stop("Missing baseline file: ", baseline_path)
          if (!file.exists(current_path)) stop("Missing benchmark results: ", current_path)

          baseline <- read.csv(baseline_path, stringsAsFactors = FALSE)
          current <- read.csv(current_path, stringsAsFactors = FALSE)

          tolerance <- 1.30  # allow up to 30% slowdown before failing
          merged <- merge(baseline, current, by = "test", suffixes = c("_base", "_cur"))
          if (nrow(merged) == 0) stop("No overlapping benchmark tests between baseline and current results")

          merged$ratio <- merged$time_seconds_cur / merged$time_seconds_base
          print(merged[, c("test", "time_seconds_base", "time_seconds_cur", "ratio")])

          bad <- merged[is.finite(merged$ratio) & merged$ratio > tolerance, , drop = FALSE]
          if (nrow(bad) > 0) {
            cat("Performance regression detected (ratio >", tolerance, "):\n")
            print(bad[, c("test", "time_seconds_base", "time_seconds_cur", "ratio")])
            quit(status = 1)
          }

          cat("No benchmark regressions beyond tolerance.\n")
        shell: Rscript {0}
