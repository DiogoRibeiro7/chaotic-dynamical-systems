name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint code
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::cyclocomp
          needs: check
          
      - name: Lint changed R code
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          LINT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: Rscript tools/lint_changed.R
        
  spell-check:
    runs-on: ubuntu-latest
    name: Spell check
    
    steps:
      - uses: actions/checkout@v6
      
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::spelling
          needs: check
          
      - name: Check spelling
        run: |
          if (!requireNamespace("spelling", quietly = TRUE)) {
            install.packages("spelling")
          }

          spelling_errors <- spelling::spell_check_package()
          if (nrow(spelling_errors) > 0) {
            cat("Spelling errors found:\n")
            print(spelling_errors)
            cat("Add words to inst/WORDLIST or fix spelling.\n")
            quit(status = 1)
          }
        shell: Rscript {0}
